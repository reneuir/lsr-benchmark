name: Integration Tests

on:
  push: {}

jobs:
  tests:
    name: Test ${{ matrix.approach }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
        approach:
          - duckdb
          - faiss
          - kannolo
          - naive-search
          - numpy-exhaustive
          - pyterrier-splade
          - pyterrier-splade-pisa
          - seismic
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Set up Dependencies
        uses: actions/setup-python@v6
      - name: Install TIRA Client
        run: |
          pip3 install 'git+https://github.com/tira-io/tira.git@main#subdirectory=python-client'

      - name: Test retrieval approach
        run: |
          tira-cli code-submission \
              --path step-03-retrieval-approaches/${{ matrix.approach }}/ \
              --task lsr-benchmark \
              --dataset tiny-example-20251002_0-training \
              --command '/index-and-retrieve.py --dataset $inputDataset --embedding $embeddings --output $outputDir' \
              --mount-directory '$embeddings=lsr-benchmark/lightning-ir/naver-splade-v3-doc' \
              --platform host \
              --dry-run
