name: CI

on:
  push:

jobs:
  python-build:
    name: 🏗️ Build Python wheels
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check-out
        uses: actions/checkout@v6
      - name: 🧰 Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 🧰 Install dependencies
        run: pip install build twine
      - name: 🏗️ Build Python wheels
        run: python -m build
      - name: 🧪 Check package bundles
        run: twine check dist/*
      - name: 📤 Upload Python wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: dist
  python-code-check:
    name: 🔍 Check Python code
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check-out
        uses: actions/checkout@v6
      - name: 🧰 Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 🧰 Install dependencies
        run: pip install .[test]
      - name: 🔍 Check Python code
        run: ruff check .
  python-test:
    name: 🧪 Test Python code
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: 
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
    steps:
      - name: 📥 Check-out
        uses: actions/checkout@v6
      - name: 🧰 Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 🧰 Install dependencies
        run: pip install .[test]
      - name: 🧪 Test Python code
        run: pytest --cov=lsr_benchmark --cov-report=xml test
      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        if: matrix.python-version == '3.13'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  docker-build:
    name: 🏗️ Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check-out
        uses: actions/checkout@v6
      - name: 🧰 Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: 🧰 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🏗️ Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
  python-publish:
    name: 🚀 Publish Python wheels
    if: github.event_name == 'push' && endsWith(github.event.base_ref, 'main') && startsWith(github.ref, 'refs/tags')
    needs:
      - python-build
      - python-code-check
      - python-test
      - docker-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: 📥 Check-out
        uses: actions/checkout@v6
      - name: 📥 Download Python wheels
        uses: actions/download-artifact@v8
        with:
          name: wheels
          path: dist
      - name: 🚀 Publish Python wheels
        uses: pypa/gh-action-pypi-publish@release/v1
  docker-publish:
    name: 🚀 Publish Docker image
    if: github.event_name == 'push' && endsWith(github.event.base_ref, 'main') && startsWith(github.ref, 'refs/tags')
    permissions:
      packages: write
    needs:
      - python-build
      - python-code-check
      - python-test
      - docker-build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check-out
        uses: actions/checkout@v6
      - name: 🧰 Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: 🧰 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🔑 Login to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: ℹ️ Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
      - name: 🚀 Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  github-release:
    name: 🚀 Create GitHub release
    if: github.event_name == 'push' && endsWith(github.event.base_ref, 'main') && startsWith(github.ref, 'refs/tags')
    needs:
      - python-build
      - python-code-check
      - python-test
    #   - python-publish
      - docker-build
      - docker-publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check-out
        uses: actions/checkout@v6
      - name: 📥 Download Python wheels
        uses: actions/download-artifact@v8
        with:
          name: wheels
          path: dist
      - name: 🚀 Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
