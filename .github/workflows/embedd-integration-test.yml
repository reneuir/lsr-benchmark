name: Embedd Integration Test

on:
  push: {}

jobs:
  embedd-integration-test:
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set up Dependencies
        uses: actions/setup-python@v7
      - name: Install TIRA Client
        run: |
          pip3 install 'git+https://github.com/tira-io/tira.git@main#subdirectory=python-client'
          pip3 install -e .[test]

      - name: lsr-benchmark embedd
        env:
          LSR_EMBEDD_INTEGRATION_TEST: "1"
        run: pytest test/test_embedd_integration.py
